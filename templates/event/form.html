{{define "content"}}
    <div class="page-head clearfix">
        <h3 class="float-left">{{.Judul}}</h3>
        <a href="{{.Kembali}}" class="btn btn-light float-right">&larr; Kembali</a>
    </div>

    <form class="form" method="post" action="{{.Action}}">
        <div class="form-group">
            <label for="nama">Nama Event</label>
            <input type="text" value="{{.Event.Nama}}" id="nama" name="nama" class="form-control" maxlength="150" placeholder="Contoh: Konser Akhir Tahun" required>
        </div>

        <div class="form-group">
            <label for="lokasi">Lokasi</label>
            <input type="text" value="{{.Event.Lokasi}}" id="lokasi" name="lokasi" class="form-control" maxlength="150" placeholder="Contoh: Auditorium Kampus" required>
        </div>

        <div class="form-group">
            <label for="tanggal_event">Tanggal dan Jam Event</label>
            <input type="datetime-local" value="{{.TanggalInput}}" id="tanggal_event" name="tanggal_event" class="form-control" required>
            <p class="form-hint">Waktu Indonesia Barat (WIB). Boleh hari ini asalkan jamnya belum lewat.</p>
        </div>

        <div class="form-group">
            <label for="kapasitas">Kapasitas</label>
            <input type="number" value="{{.KapasitasInput}}" id="kapasitas" name="kapasitas" class="form-control" min="1" step="1" placeholder="Contoh: 500" required>
            <p class="form-hint">Jumlah orang maksimal. Total kuota semua kategori tidak boleh melebihi angka ini.</p>
        </div>

        <div class="form-group">
            <label for="deskripsi">Deskripsi</label>
            <textarea id="deskripsi" name="deskripsi" class="form-control" rows="3">{{.Event.Deskripsi}}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn">Simpan</button>
            <a href="{{.Kembali}}" class="btn btn-light">Batal</a>
        </div>
    </form>
{{end}}
