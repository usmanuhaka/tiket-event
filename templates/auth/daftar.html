{{define "content"}}
    <div class="page-head clearfix">
        <h3 class="float-left">Daftar Akun Pembeli</h3>
        <a href="/login" class="btn btn-light float-right">&larr; Kembali ke login</a>
    </div>

    <form class="form" method="post" action="/daftar">
        <div class="form-group">
            <label for="nama">Nama Lengkap</label>
            <input type="text" value="{{.NamaBaru}}" id="nama" name="nama" class="form-control" maxlength="100" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" value="{{.Email}}" id="email" name="email" class="form-control" maxlength="150" placeholder="Contoh: budi@kampus.test" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" minlength="8" maxlength="72" required>
            <p class="form-hint">Minimal 8 karakter.</p>
        </div>

        <div class="form-group">
            <label for="konfirmasi">Ulangi Password</label>
            <input type="password" id="konfirmasi" name="konfirmasi" class="form-control" minlength="8" maxlength="72" required>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn">Daftar</button>
        </div>
    </form>
{{end}}
